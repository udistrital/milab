services:
  edx-mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edx-mock
    env_file:
      - path: .env
        required: false
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD', 'node', 'src/healthcheck.js']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
